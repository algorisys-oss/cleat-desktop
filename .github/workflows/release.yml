# Build Cleat on every platform and publish a GitHub Release.
#
# Tauri bundles for its host platform only — a Linux machine cannot produce a
# .dmg or .msi — so cross-platform artifacts require one runner per target.
# That is the entire reason this workflow exists rather than a local script.
#
# Triggered by pushing a tag, which `/shipit` does after bumping the version:
#     git tag v0.1.1 && git push origin v0.1.1
#
# Also runnable by hand from the Actions tab (workflow_dispatch) against a tag
# that already exists.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.1)"
        required: true
        type: string

# Needed to create the release and upload assets. Nothing else is granted.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate the matrix on the test suite. Publishing a release whose tests were
  # never run defeats the point of having them, and the unit tests need no
  # container runtime — the integration tests skip cleanly without one.
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-rs/src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-rs/package-lock.json

      - name: Install npm dependencies
        working-directory: tauri-rs
        run: npm ci

      - name: Typecheck frontend
        working-directory: tauri-rs
        run: npx tsc --noEmit

      - name: Rust tests
        working-directory: tauri-rs/src-tauri
        run: cargo test

      # The updater signs its artifacts, and the build fails without the key —
      # but it fails deep inside the bundler on four runners at once, twenty
      # minutes in. Fail here instead, with the fix in the message.
      - name: Check the updater signing key is present
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set. Updater artifacts \
          cannot be signed without it and the build will fail. Add it under \
          Settings > Secrets and variables > Actions (see docs/updates.md)."
            exit 1
          fi

  build:
    name: Build ${{ matrix.label }}
    needs: test
    strategy:
      # One platform failing should not discard the artifacts of the others;
      # a partial release is easier to top up than to rebuild from scratch.
      fail-fast: false
      matrix:
        include:
          # `binary` is where cargo leaves the bare executable and `asset` is
          # what it is called on the release. Passing --target moves the output
          # under a triple-named directory, which is why the macOS paths differ.
          - platform: ubuntu-22.04
            label: Linux (deb/rpm/AppImage)
            args: ""
            rust_target: ""
            binary: tauri-rs/src-tauri/target/release/cleat
            asset: cleat-linux-x86_64
          - platform: macos-latest
            label: macOS (Apple silicon)
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
            binary: tauri-rs/src-tauri/target/aarch64-apple-darwin/release/cleat
            asset: cleat-macos-aarch64
          # Cross-compiled from the Apple-silicon runner rather than built on an
          # Intel one. `macos-13` jobs sat queued indefinitely — no runner was
          # ever assigned — which left every run since v0.1.2 permanently
          # in-progress. Same OS family and one Xcode ships both SDKs, so this
          # is an ordinary cross-build, not the Linux-can't-make-a-dmg problem.
          - platform: macos-latest
            label: macOS (Intel)
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
            binary: tauri-rs/src-tauri/target/x86_64-apple-darwin/release/cleat
            asset: cleat-macos-x86_64
          - platform: windows-latest
            label: Windows (msi/exe)
            args: ""
            rust_target: ""
            binary: tauri-rs/src-tauri/target/release/cleat.exe
            asset: cleat-windows-x86_64.exe

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Ubuntu 22.04 carries webkit2gtk 4.1, which is what Tauri v2 wants.
      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      # Keyed on the asset, not the platform: both macOS jobs now run on the
      # same runner image and would otherwise share one cache between two
      # different target triples.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-rs/src-tauri
          key: ${{ matrix.asset }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tauri-rs/package-lock.json

      - name: Install npm dependencies
        working-directory: tauri-rs
        run: npm ci

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and the `latest.json` the running app
          # reads. This is not OS code signing — it is the separate minisign
          # key that proves an update came from this project, and the app
          # refuses any update it cannot verify against the public key baked
          # into tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: tauri-rs
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: Cleat ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Container management for Docker and Podman.

            Pick the artifact for your platform below. Linux users can take the
            `.deb` or `.rpm` (small — they link the system WebKitGTK) or the
            `.AppImage` (large, self-contained, no install step).

            The `cleat-*` files are the bare executables, for running without
            installing anything. They need the WebKitGTK runtime already present
            on the machine, so on a clean box prefer a package or the AppImage.
            On Linux and macOS you will need `chmod +x` — GitHub does not
            preserve the executable bit on release assets.

            **These builds are not code-signed.** macOS Gatekeeper will need
            `xattr -dr com.apple.quarantine /Applications/Cleat.app`, and
            Windows SmartScreen will warn on first run.

            Cleat needs a reachable Docker or Podman socket; Podman users may
            need `systemctl --user start podman.socket`.

            **Updates.** Installed copies check here for newer releases and
            offer them in the status bar. The AppImage, the Windows installers
            and the macOS app update themselves; `.deb`, `.rpm` and the bare
            executables cannot, and are pointed back at this page instead.
          # Published immediately. Flip to true if you would rather review the
          # notes before it goes public.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # tauri-action uploads the *bundles* only. The bare executable is a
      # separate artifact people genuinely want — for a machine that already has
      # the WebKitGTK runtime, or for dropping on a box without installing a
      # package — so it is attached here.
      #
      # The step above has already created-or-reused the release by this point,
      # so there is no race between matrix jobs; each uploads a distinctly named
      # asset. --clobber makes a re-run of the same tag idempotent.
      - name: Attach the bare executable
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -f "${{ matrix.binary }}" ]; then
            echo "::error::expected binary at ${{ matrix.binary }} but it is not there"
            find tauri-rs/src-tauri/target -maxdepth 3 -name 'cleat*' -type f || true
            exit 1
          fi
          cp "${{ matrix.binary }}" "${{ matrix.asset }}"
          gh release upload "$TAG" "${{ matrix.asset }}" --clobber --repo "$GITHUB_REPOSITORY"
          echo "uploaded ${{ matrix.asset }} ($(du -h "${{ matrix.asset }}" | cut -f1))"
