[package]
name = "cleat"
version = "0.3.1"
description = "Container management for Docker and Podman"
authors = ["Rajesh Pillai"]
edition = "2021"
license = "MIT"
repository = "https://github.com/algorisys-oss/cleat-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cleat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bollard = "0.21.0"
tokio = { version = "1.53.1", features = ["full"] }
futures-util = "0.3.33"
thiserror = "2.0.19"
tauri-plugin-dialog = "2.7.2"
async-trait = "0.1.91"
bytes = "1.12.1"
base64 = "0.22.1"
hyper = "1.11.0"
http-body-util = "0.1.4"
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1"] }
kube = { version = "4.2.0", features = ["client", "config", "runtime", "ws"] }
k8s-openapi = { version = "0.28.0", features = ["v1_34"] }
serde_yaml = "0.9.34"
futures-channel = "0.3.33"

# The Engine API arrives over a different transport per platform, and each
# transport crate only compiles for its own: hyperlocal is unix-domain sockets
# and does not build on Windows at all, which is why it cannot sit in
# [dependencies]. bollard's `pipe` feature pulls the named-pipe connector that
# `connect_with_defaults` needs to find Docker Desktop.
[target.'cfg(unix)'.dependencies]
hyperlocal = "0.9.1"

[target.'cfg(windows)'.dependencies]
bollard = { version = "0.21.0", features = ["pipe"] }

